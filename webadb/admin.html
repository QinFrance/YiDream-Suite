<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#f6f8fc"><title>YiDream · Administration</title><link rel="icon" href="./assets/yidream-logo.png"><style>

er;gap:12px;color:var(--muted);font-size:11px;margin:14px 0}.auth .or:before,.auth .or:after{content:"";height:1px;background:var(--line);flex:1}.msg{min-height:19px;color:#b23e3e;font-size:12px;margin-top:10px}.link{color:var(--blue);border:0;background:none;padding:0;font-weight:700}@media(max-width:800px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;padding:12px 14px;display:block}.brand{padding:0 4px 9px}.workspace,.side-bottom{display:none}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.content{padding:20px 14px}.topbar{padding:0 14px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr}}@media(max-width:520px){.form{grid-template-columns:1fr}.content{padding:16px 12px}.table{min-width:600px}}</style></head><body><div id="app"><div class="auth-wrap"><section class="auth"><h1>YiDream Suite</h1><p>Chargement de votre espace revendeur…</p></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script type="module" src="./src/admin-console.js"></script></body></html>
