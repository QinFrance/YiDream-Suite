name: Deploy YiDream Web ADB

on:
  push:
    branches: [ main, master ]
    paths:
      - 'webadb/**'
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/deploy-webadb.yml'
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Récupérer l’APK YiDream officiel et vérifier son empreinte
        run: |
          mkdir -p webadb/public
          curl --fail --silent --show-error --retry 3 https://qinfrance.github.io/YiDream/version.json -o "$RUNNER_TEMP/yidream-version.json"
          APK_URL=$(jq -er '.apkUrl | select(. == "https://qinfrance.github.io/YiDream/admin/yidream.apk")' "$RUNNER_TEMP/yidream-version.json")
          APK_SHA=$(jq -er '.apkSha256 | select(test("^[a-fA-F0-9]{64}$"))' "$RUNNER_TEMP/yidream-version.json")
          curl --fail --silent --show-error --retry 3 "$APK_URL" -o webadb/public/yidream.apk
          echo "$APK_SHA  webadb/public/yidream.apk" | sha256sum --check
          cp "$RUNNER_TEMP/yidream-version.json" webadb/public/yidream-version.json
          curl --fail --silent --show-error --retry 3 https://qinfrance.github.io/YiDream/admin/yidream-build.json -o webadb/public/yidream-build.json
          cat webadb/supabase/migrations/20261029000000_mdm_catalog_and_site_requests.sql webadb/supabase/migrations/20261030000000_catalog_releases_and_revocation.sql > webadb/public/mdm-setup.sql

      # --- Compilation et déploiement du site ---
      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Vérifier les réexécutions de la migration SQL
        working-directory: webadb/supabase/tests
        run: |
          npm ci --ignore-scripts
          npm test

      - name: Installer les dépendances
        working-directory: webadb
        run: npm ci

      - name: Compiler le site
        working-directory: webadb
        run: |
          node --test tests/current-apk.test.mjs tests/mdm-model.test.mjs
          npm run build

      - name: Configurer GitHub Pages
        uses: actions/configure-pages@v5

      - name: Préparer l'artefact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: webadb/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Déployer sur GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
