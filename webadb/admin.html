<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f8fc">
  <title>YiDream · Administration</title>
  <link rel="icon" href="./assets/yidream-logo.png">
  <style>
    :root{--bg:#f6f8fc;--paper:#fff;--ink:#102448;--muted:#73819a;--line:#dce5f2;--accent:#7257d6;--pale:#f0ebfc;--soft:#f8f6ff;--shadow:0 12px 35px #1c3c7012}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    button,input,select{font:inherit}button{cursor:pointer}
    .shell{min-height:100vh;display:grid;grid-template-columns:245px minmax(0,1fr)}
    .side{background:#fff;border-right:1px solid var(--line);padding:22px 16px;display:flex;flex-direction:column}
    .brand{display:flex;align-items:center;gap:10px;padding:2px 10px 23px;font-size:19px;font-weight:800;letter-spacing:-.04em;color:var(--ink);text-decoration:none}
    .brand img{width:35px;height:35px;object-fit:contain}
    .brand .suite-word{color:var(--muted);font-weight:500}
    .workspace{padding:0 10px 19px;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    .nav{display:grid;gap:5px}
    .nav button{width:100%;border:0;background:transparent;color:#536178;text-align:left;padding:11px 12px;border-radius:11px;font-weight:650;display:flex;gap:10px;align-items:center}
    .nav button:hover,.nav button.active{background:var(--pale);color:var(--accent)}
    .nav .ico{width:19px;text-align:center;font-size:16px}
    .platform-heading{padding:20px 10px 8px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em;font-weight:800}
    .platform-list{display:grid;gap:3px}
    .platform-group{min-width:0}
    .platform-toggle{width:100%;border:0;background:transparent;color:#536178;text-align:left;padding:9px 10px;border-radius:10px;font-weight:650;display:flex;gap:8px;align-items:center}
    .platform-toggle:hover,.platform-toggle.active{background:var(--pale);color:var(--accent)}
    .platform-toggle .ico{width:19px;text-align:center;font-size:15px;flex:none}
    .platform-toggle .platform-label{flex:1;min-width:0}
    .platform-toggle .chevron{color:var(--muted);font-size:11px}
    .platform-submenu{display:grid;gap:5px;margin:0 0 6px 19px;padding:7px 8px 8px;border-left:1px solid var(--line)}
    .platform-action,.platform-link{border:0;background:transparent;color:var(--ink);text-align:left;text-decoration:none;padding:6px 7px;border-radius:8px;font-size:11px;font-weight:650}
    .platform-action:hover,.platform-link:hover{background:var(--soft);color:var(--accent)}
    .platform-status{font-size:10px;padding:4px 7px;border-radius:7px;font-weight:750}
    .platform-status.available{background:#f0ebfc;color:var(--accent)}
    .platform-status.coming{background:#f0f2f7;color:#66738a}
    .side-bottom{margin-top:auto;border-top:1px solid var(--line);padding:16px 0 0;overflow-wrap:anywhere}
    .account-box{position:relative}
    .account-trigger{width:100%;display:flex;align-items:center;gap:10px;padding:7px;border:1px solid transparent;border-radius:12px;background:transparent;text-align:left;color:var(--ink)}
    .account-trigger:hover,.account-trigger[aria-expanded="true"]{background:#faf9ff;border-color:var(--line)}
    .account-copy{min-width:0;flex:1}
    .account-copy b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .account-copy small{display:block;color:var(--muted);font-size:11px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .avatar{width:35px;height:35px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--pale);color:var(--accent);font-weight:800}
    .account-caret{color:var(--muted);font-size:12px}
    .account-menu{position:absolute;left:0;right:0;bottom:calc(100% + 10px);z-index:20;padding:13px;border:1px solid var(--line);border-radius:14px;background:#fff;box-shadow:0 14px 35px #10244820}
    .account-menu-head{display:grid;gap:3px;margin:0 2px 11px}
    .account-menu-head small{font-size:9px;color:var(--muted);font-weight:800;letter-spacing:.1em}
    .account-menu-head b{font-size:13px}
    .account-menu-head span{font-size:11px;color:var(--muted);overflow-wrap:anywhere}
    .account-menu-rule{height:1px;background:var(--line);margin:9px 0}
    .logout-button{width:100%;border:1px solid #f1cecc;border-radius:9px;background:#fff8f7;color:#b42318;text-align:left;padding:9px 10px;font-size:12px;font-weight:750}
    .logout-button:hover{background:#fff0ee}
    .activity-row{display:grid;gap:3px;padding:12px 0;border-top:1px solid var(--line)}
    .activity-row:first-of-type{border-top:0}
    .activity-row b{font-size:12px}.activity-row small{font-size:11px;color:var(--muted)}
    .main{min-width:0}
    .topbar{min-height:66px;padding:0 30px;display:flex;align-items:center;justify-content:space-between;gap:14px;border-bottom:1px solid var(--line);background:#ffffffcf}
    .crumb{color:var(--muted);font-size:13px}.crumb b{color:var(--ink)}
    .top-actions{display:flex;gap:13px;align-items:center}
    .role{border-radius:99px;background:var(--pale);padding:6px 10px;font-size:10px;color:var(--accent);font-weight:800;letter-spacing:.04em}
    .hebrew-decor{color:#7762d5;font-size:15px;font-weight:750;line-height:1;direction:rtl;pointer-events:none;user-select:none}
    .content{max-width:1250px;margin:auto;padding:30px}
    .heading{display:flex;align-items:flex-start;justify-content:space-between;gap:15px;margin-bottom:22px}
    .heading h1{font-size:27px;letter-spacing:-.04em;margin:0 0 5px}
    .heading p{margin:0;color:var(--muted)}
    .stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:21px}
    .stat,.panel{background:var(--paper);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
    .stat{padding:17px}.stat label{color:var(--muted);font-size:12px;font-weight:650}
    .stat strong{display:block;font-size:26px;letter-spacing:-.04em;margin-top:7px}
    .stat small{color:var(--muted);font-size:11px}
    .dashboard-grid{display:grid;grid-template-columns:1.35fr .85fr;gap:16px}
    .panel{padding:19px;min-width:0}
    .panel-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
    .panel h2{font-size:15px;margin:0}
    .panel-head small{color:var(--muted)}
    .device-row{display:grid;grid-template-columns:minmax(130px,1fr) minmax(70px,120px) auto auto;align-items:center;gap:12px;padding:13px 2px;border-top:1px solid var(--line)}
    .device-row:first-of-type{border-top:0}
    .device-name{display:flex;gap:10px;align-items:center;min-width:0}
    .device-icon{width:36px;height:36px;flex:none;display:grid;place-items:center;background:var(--soft);border-radius:11px;font-size:16px}
    .device-name b{display:block;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .device-name small,.cell{font-size:11px;color:var(--muted)}
    .badge{padding:4px 8px;border-radius:99px;background:var(--pale);color:var(--accent);font-weight:750;font-size:10px;white-space:nowrap}
    .badge.neutral{background:#f0f2f7;color:#66738a}
    .table-wrap{overflow:auto}
    .table{width:100%;border-collapse:collapse}
    .table th{text-align:left;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.06em;padding:10px 8px}
    .table td{padding:12px 8px;border-top:1px solid var(--line);font-size:12px}
    .table td:last-child{text-align:right}
    .person{display:flex;gap:10px;align-items:center}.person b{font-size:12px}
    .actions,.table-actions{display:flex;gap:9px;align-items:center;flex-wrap:wrap}
    .search,.field input,.field select,.actions select{border:1px solid var(--line);border-radius:10px;padding:10px 11px;background:#fff;color:var(--ink)}
    .search{flex:1;min-width:180px}
    .button{border:1px solid var(--line);background:white;color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:650}
    .button:hover{border-color:#c7baf0;background:#fcfbff}
    .button.primary{background:var(--accent);border-color:var(--accent);color:white}
    .button.primary:hover{background:#6246c5}
    .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:15px;overflow:auto}
    .tabs button{border:0;background:transparent;padding:10px 12px;color:var(--muted);font-weight:700;white-space:nowrap;border-bottom:2px solid transparent}
    .tabs button.active{color:var(--accent);border-color:var(--accent)}
    .form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}
    .field{display:grid;gap:6px}.field label{font-size:11px;color:var(--muted);font-weight:700}
    .notice{padding:12px 14px;border-radius:11px;background:var(--pale);color:#536178;font-size:11px;margin-top:14px}
    .empty{padding:32px;text-align:center;color:var(--muted)}
    .link{color:var(--accent);font-weight:700;border:0;background:transparent;padding:4px}
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(ellipse at top left,#f0ebfc 0,transparent 42%),linear-gradient(135deg,#f6f8fc,#fbfcff)}
    .auth{width:min(430px,100%);padding:29px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:var(--shadow)}
    .auth .brand{padding:0 0 22px}
    .auth h1{font-size:24px;letter-spacing:-.03em;margin:0 0 6px}
    .auth p{color:var(--muted);margin:0 0 19px}
    .auth .field{margin:13px 0}.auth .button{width:100%;padding:11px}
    .auth .or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:11px;margin:14px 0}
    .auth .or:before,.auth .or:after{content:"";height:1px;background:var(--line);flex:1}
    .msg{min-height:19px;color:#a94343;font-size:12px;margin:10px 0}
    .auth .msg:empty{min-height:0;margin:0}
    .google-button{display:flex;align-items:center;justify-content:center;gap:9px}
    .google-mark{font-weight:800;font-size:16px;color:#4285f4}
    .hidden{display:none!important}
    @media(max-width:950px){.shell{grid-template-columns:210px minmax(0,1fr)}.content{padding:23px}.dashboard-grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
    @media(max-width:700px){.shell{grid-template-columns:1fr}.side{position:sticky;top:0;z-index:4;padding:11px 13px;display:block;max-height:70vh;overflow:auto}.brand{padding:0 4px 8px}.workspace{display:none}.nav{display:flex;overflow:auto}.nav button{width:auto;white-space:nowrap}.platform-heading{padding:12px 5px 6px}.platform-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:2px 8px}.platform-submenu{margin-left:12px}.side-bottom{display:block;margin-top:10px;padding:9px 0 0}.account-menu{left:auto;right:0;bottom:auto;top:calc(100% + 8px);width:min(310px,calc(100vw - 30px))}.topbar{padding:12px 14px;min-height:58px}.top-actions .role{display:none}.content{padding:20px 14px}}
    @media(max-width:520px){.form{grid-template-columns:1fr}.content{padding:16px 12px}.topbar{align-items:flex-start}.top-actions .button{padding:8px}.stats{gap:9px}.stat{padding:13px}.stat strong{font-size:23px}.device-row{grid-template-columns:minmax(120px,1fr) auto;gap:6px}.device-row .cell:nth-child(2){display:none}.table{min-width:600px}.heading{align-items:center}.heading h1{font-size:23px}}
  </style>
<style>
    .content{padding-bottom:104px}
    .apps-dock{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:6px;padding:8px 10px 6px;border:1px solid rgba(220,229,242,.9);border-radius:20px;background:rgba(255,255,255,.86);backdrop-filter:blur(18px);box-shadow:0 12px 35px rgba(20,35,67,.18)}
    .app-dock-item{position:relative;width:72px;min-height:68px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:0;border-radius:13px;background:transparent;color:var(--ink);text-decoration:none;font:inherit;cursor:pointer}
    .app-dock-item:hover,.app-dock-item.active{background:var(--pale);color:var(--accent)}
    .app-dock-icon{width:42px;height:42px;display:grid;place-items:center;font-size:28px;line-height:1}
    .app-dock-icon img{width:100%;height:100%;object-fit:contain}
    .app-dock-item small{font-size:10px;font-weight:700}
    .app-dock-item em{position:absolute;top:3px;right:0;padding:2px 4px;border-radius:5px;background:#fff2d6;color:#875d09;font-size:7px;font-style:normal;font-weight:800}
    .app-dock-item.coming{opacity:.7;cursor:not-allowed}
    @media(max-width:520px){.content{padding-bottom:96px}.apps-dock{bottom:8px;gap:2px;padding:5px 6px 4px}.app-dock-item{width:62px;min-height:58px}.app-dock-icon{width:36px;height:36px;font-size:24px}.app-dock-item small{font-size:9px}}
  </style>
</head>
<body>
  <div id="app"><div class="auth-wrap"><section class="auth"><h1>YiDream Suite</h1><p>Chargement de votre espace revendeur…</p></section></div></div>
  <script>
    (() => {
      const showBootError = (message, details = '') => {
        const app = document.getElementById('app');
        if (!app || !app.textContent.includes('Chargement de votre espace revendeur')) return;
        app.innerHTML = '<div class="auth-wrap"><section class="auth"><h1>YiDream Suite</h1><p id="bootErrorMessage"></p><button class="button primary" onclick="location.reload()">Réessayer</button><p style="font-size:12px;margin-top:12px">Si le problème continue, vérifiez que les scripts du site ne sont pas bloqués par le navigateur.</p></section></div>';
        app.querySelector('#bootErrorMessage').textContent = message;
        if (details) {
          const diagnostic = document.createElement('pre');
          diagnostic.textContent = details;
          diagnostic.style = 'white-space:pre-wrap;overflow-wrap:anywhere;font:11px/1.4 monospace;color:#a94343;background:#fff6f5;padding:10px;border-radius:8px;margin:10px 0';
          app.querySelector('.auth').append(diagnostic);
        }
      };
      setTimeout(() => showBootError('Le chargement prend plus de temps que prévu.'), 15000);
      window.addEventListener('error', (event) => {
        if (event instanceof ErrorEvent) {
          const details = [event.message, event.filename, event.lineno ? 'ligne ' + event.lineno : '', event.error?.stack || ''].filter(Boolean).join('\n');
          console.error('YiDream admin startup error:', details);
          showBootError('Le démarrage a rencontré une erreur JavaScript.', details || 'Le navigateur n’a pas fourni de détail.');
        } else if (event.target instanceof HTMLScriptElement && event.target.type === 'module') {
          const details = event.target.src;
          console.error('YiDream admin module failed to load:', details);
          showBootError('Le module administrateur n’a pas pu être chargé.', details);
        }
      });
      window.addEventListener('unhandledrejection', (event) => {
        console.error('YiDream admin startup request failed:', event.reason);
        showBootError('La connexion au service a échoué. Rechargez la page puis réessayez.');
      });
    })();
  </script>
  <script>
    window.supabaseReady = new Promise((resolve) => {
      let settled = false;
      const finish = (client) => { if (!settled) { settled = true; resolve(client || null); } };
      const sources = [
        'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2',
        'https://unpkg.com/@supabase/supabase-js@2/dist/umd/supabase.js'
      ];
      const load = (index) => {
        if (index >= sources.length) { finish(null); return; }
        const script = document.createElement('script');
        script.src = sources[index];
        script.onload = () => window.supabase?.createClient ? finish(window.supabase) : load(index + 1);
        script.onerror = () => load(index + 1);
        document.head.appendChild(script);
      };
      load(0);
      setTimeout(() => finish(null), 12000);
    });
  </script>
  <script type="module" src="./src/admin-console.js"></script>
</body>
</html>
